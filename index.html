<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Project</title>

    <!-- CSS Source -->
    <link rel="stylesheet" href="./css/styles.css"/>

    <!-- JS Source -->
    <script defer src="./js/script.js"></script>
</head>
<body>
    <div class="counter-box">
        <div class="content">
            <h1 style="margin-bottom: 20px;">Counter Box</h1>
        
            <h1 style="margin-bottom: 10px;">
                Count1: <span class="counter" data-item="Counter-1" data-number="10" data-time="1000">0</span>
            </h1>

            <h1>
                Count2: <span class="counter" data-item="Counter-2" data-number="12" data-time="500">0</span>
            </h1>
        </div>
    </div>
</body>
</html>
